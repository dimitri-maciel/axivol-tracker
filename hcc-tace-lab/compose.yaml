name: hcc-tace-lab
services:
  app:
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:${HCC_LAB_PORT:-8770}:8000"
    volumes:
      - type: bind
        source: ${HCC_DATA_DIR:-./data}
        target: /data
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
  ingest:
    build:
      context: .
      target: ingest
    profiles: [tools]
    user: "${HCC_UID:-501}:${HCC_GID:-20}"
    volumes:
      - type: bind
        source: ${HCC_DATA_DIR:-./data}
        target: /data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
